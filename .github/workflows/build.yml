name: Build Trade Chart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Build production app
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: trade-chart-dist
          path: dist/
